# =============================================================================
# Ultrium Vanguard Agent Configuration
# =============================================================================
# Pre-configured for your Vanguard deployment
# 
# Usage:
#   python vanguard_agent.py --config config.yaml
# =============================================================================

agent:
  # Unique identifier for this agent
  device_id: "vanguard-01"
  
  # Human-readable name shown in the dashboard
  name: "Lab Vanguard Agent"
  
  # Physical location (for organization)
  location: "server-room-1"
  
  # Your Vanguard user UUID
  user_id: "b8cfe427-6c70-456c-a793-2279f9ddae40"

api:
  # Vanguard API endpoint
  endpoint: "https://nsyobmjpdpvesjwdphlh.supabase.co/functions/v1/vanguard-agent-api"
  
  # Your agent secret key (X-VANGUARD-KEY header)
  secret_key: "vgd_sk_7Kx9mPqR3nTwYz2JfL8sHcN6bVdXaE4uGtM1oWpQ5iA"
  
  # Request timeout in seconds
  timeout: 30

intervals:
  # How often to send heartbeats (seconds)
  heartbeat: 60
  
  # How often to poll for commands (seconds)
  command_poll: 30
  
  # How often to run network scans (seconds)
  scan: 3600
  
  # How often to sync Meraki data (seconds)
  meraki: 300

logging:
  level: "INFO"
  file: "/var/log/vanguard-agent.log"
  max_bytes: 10485760
  backup_count: 5

features:
  collect_temperature: true
  collect_network_io: true
  execute_commands: true

# =============================================================================
# Network Scanning (nmap)
# =============================================================================

scanning:
  enabled: true
  targets: []  # Auto-detect local network
  scan_types:
    discovery: true
    ports: true
    os_detection: false
    service_detection: true
  port_range: "1-1024"
  timeout: 600
  sudo_required: false

# =============================================================================
# Cisco Meraki Integration
# =============================================================================
# Get your API key from: Dashboard → Organization → Settings → API access
# =============================================================================

meraki:
  enabled: true
  
  # PASTE YOUR MERAKI API KEY HERE
  api_key: "YOUR_MERAKI_API_KEY_HERE"
  
  base_url: "https://api.meraki.com/api/v1"
  collect_organizations: true
  collect_networks: true
  collect_devices: true
  collect_clients: true
  collect_uplinks: true
  collect_vpn_status: false
  client_timespan: 86400
