name: Build Vanguard macOS Agents

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-agent:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Xcode project
        run: |
          mkdir -p VanguardAgentMac/VanguardAgent.xcodeproj
          cat > VanguardAgentMac/VanguardAgent.xcodeproj/project.pbxproj << 'EOF'
          // Minimal pbxproj - in production, use proper Xcode project
          EOF

      - name: Build Agent
        run: |
          cd VanguardAgentMac
          swift build -c release
          mkdir -p build/Release
          cp .build/release/VanguardAgent build/Release/

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -r VanguardAgentMac/build/Release/VanguardAgent.app dmg_temp/ 2>/dev/null || true
          hdiutil create -volname "Vanguard Agent" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            VanguardAgent-${{ github.event.inputs.version }}.dmg || echo "DMG creation skipped - no app bundle"

      - name: Upload Agent
        uses: actions/upload-artifact@v4
        with:
          name: VanguardAgent-macOS
          path: VanguardAgent-*.dmg
          if-no-files-found: warn

  build-portal:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Portal
        run: |
          cd VanguardPortalMac
          swift build -c release
          mkdir -p build/Release

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -r VanguardPortalMac/build/Release/VanguardPortal.app dmg_temp/ 2>/dev/null || true
          hdiutil create -volname "Vanguard Portal" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            VanguardPortal-${{ github.event.inputs.version }}.dmg || echo "DMG creation skipped"

      - name: Upload Portal
        uses: actions/upload-artifact@v4
        with:
          name: VanguardPortal-macOS
          path: VanguardPortal-*.dmg
          if-no-files-found: warn

  release:
    needs: [build-agent, build-portal]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: macos-v${{ github.event.inputs.version }}
          name: Vanguard macOS Agents v${{ github.event.inputs.version }}
          body: |
            ## Vanguard macOS Agents v${{ github.event.inputs.version }}
            
            Native Swift applications for macOS.
            
            ### Downloads
            - **VanguardAgent-macOS.dmg** - RMM Agent for monitoring and remote management
            - **VanguardPortal-macOS.dmg** - Customer support portal (menu bar app)
            
            ### Requirements
            - macOS 13.0 (Ventura) or later
            - Apple Silicon or Intel Mac
            
            ### Installation
            
            1. Download the appropriate DMG
            2. Open and drag to Applications
            3. Launch and configure
            
            ### MDM Deployment
            
            Configure via User Defaults:
            ```bash
            # Agent
            defaults write com.ultrium.VanguardAgent userId "YOUR-UUID"
            defaults write com.ultrium.VanguardAgent secretKey "vgd_sk_xxx"
            
            # Portal
            defaults write com.ultrium.VanguardPortal portalKey "your-key"
            defaults write com.ultrium.VanguardPortal companyName "Your MSP"
            ```
          files: |
            artifacts/VanguardAgent-macOS/*.dmg
            artifacts/VanguardPortal-macOS/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
