name: Build Vanguard MSI Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.0)'
        required: true
        default: '1.2.0'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build-agent-msi:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Publish Agent
        run: |
          dotnet publish VanguardAgent/VanguardAgent.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:Version=${{ github.event.inputs.version }} `
            -o ./publish/agent

      - name: Copy Icon to Publish
        run: |
          Copy-Item "VanguardAgent/vanguard.ico" -Destination "./publish/agent/vanguard.ico"

      - name: Build Agent MSI
        run: |
          wix build VanguardAgent/installer/VanguardAgent.wxs `
            -d PublishDir=./publish/agent `
            -o ./msi/VanguardAgent-${{ github.event.inputs.version }}.msi

      - name: Upload Agent MSI
        uses: actions/upload-artifact@v4
        with:
          name: VanguardAgent-MSI
          path: ./msi/VanguardAgent-*.msi

  release:
    needs: [build-agent-msi]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Vanguard Agent v${{ github.event.inputs.version }}
          body: |
            ## Vanguard Agent v${{ github.event.inputs.version }}
            
            Combined RMM Agent + Customer Portal for Windows systems.
            
            ### Features
            - RMM Monitoring: System telemetry, command execution, health tracking
            - Tray Icon: Always-visible Vanguard shield icon in system tray
            - Customer Portal: WebView2-based self-service portal popup
            - Quick Actions: New tickets, view tickets, system health checks
            - SafeSuite Integration: Access to SafePass, SafeScan, SafeWeb, SafeTrack
            
            ### Silent Installation
            
            ```powershell
            msiexec /i VanguardAgent-${{ github.event.inputs.version }}.msi /qn USERID="your-uuid" SECRETKEY="vgd_sk_xxx"
            ```
            
            ### Enterprise Deployment
            Compatible with:
            - Microsoft Intune
            - SCCM/MECM
            - Group Policy Software Installation
            - PDQ Deploy
            - Any MSI-compatible RMM
            
            ### Requirements
            - Windows 10/11 or Windows Server 2019+
            - WebView2 Runtime (for portal popup)
          files: |
            artifacts/VanguardAgent-MSI/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
