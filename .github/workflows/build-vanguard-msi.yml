name: Build Vanguard MSI Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.2.0)'
        required: true
        default: '1.2.0'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build-agent-msi:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Publish Agent
        run: |
          dotnet publish VanguardAgent/VanguardAgent.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:Version=${{ github.event.inputs.version }} `
            -p:TreatWarningsAsErrors=false `
            -o ./publish/agent
          
          # Ensure config.json is in publish directory
          Copy-Item "VanguardAgent/config.json" -Destination "./publish/agent/config.json" -Force

      - name: Copy Icon to Publish
        run: |
          Copy-Item "VanguardAgent/vanguard.ico" -Destination "./publish/agent/vanguard.ico"

      - name: Build Agent MSI
        run: |
          wix build VanguardAgent/installer/VanguardAgent.wxs `
            -d PublishDir=./publish/agent `
            -o ./msi/VanguardAgent-${{ github.event.inputs.version }}.msi

      - name: Upload Agent MSI
        uses: actions/upload-artifact@v4
        with:
          name: VanguardAgent-MSI
          path: ./msi/VanguardAgent-*.msi

  release:
    needs: [build-agent-msi]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Rename MSI for consistency
        run: |
          cd artifacts/VanguardAgent-MSI
          # Rename versioned MSI to consistent name for storage
          for f in VanguardAgent-*.msi; do
            cp "$f" VanguardAgent.msi
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Vanguard Agent v${{ github.event.inputs.version }}
          body: |
            ## Vanguard Agent v${{ github.event.inputs.version }}
            
            Combined RMM Agent + Customer Portal for Windows systems.
            
            ### Features
            - RMM Monitoring: System telemetry, command execution, health tracking
            - Tray Icon: Always-visible Vanguard shield icon in system tray
            - Customer Portal: WebView2-based self-service portal popup
            - Quick Actions: New tickets, view tickets, system health checks
            - SafeSuite Integration: Access to SafePass, SafeScan, SafeWeb, SafeTrack
            
            ### Silent Installation
            
            ```powershell
            msiexec /i VanguardAgent-${{ github.event.inputs.version }}.msi /qn USERID="your-uuid" SECRETKEY="vgd_sk_xxx"
            ```
            
            ### Enterprise Deployment
            Compatible with:
            - Microsoft Intune
            - SCCM/MECM
            - Group Policy Software Installation
            - PDQ Deploy
            - Any MSI-compatible RMM
            
            ### Requirements
            - Windows 10/11 or Windows Server 2019+
            - WebView2 Runtime (for portal popup)
          files: |
            artifacts/VanguardAgent-MSI/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-storage:
    name: Upload to Supabase Storage
    needs: [build-agent-msi, release]
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    
    steps:
      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are configured"

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: VanguardAgent-MSI
          path: ./artifacts

      - name: Upload MSI to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Rename to consistent filename
          cd artifacts
          for f in VanguardAgent-*.msi; do
            cp "$f" VanguardAgent.msi
          done
          
          echo "Uploading VanguardAgent.msi to Supabase Storage..."
          
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/vanguard-agents/VanguardAgent.msi" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @./VanguardAgent.msi)
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Successfully uploaded VanguardAgent.msi (HTTP $HTTP_STATUS)"
          else
            echo "::error::Upload failed with HTTP $HTTP_STATUS"
            cat /tmp/response.txt
            exit 1
          fi
