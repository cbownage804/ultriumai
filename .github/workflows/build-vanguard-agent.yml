# Vanguard Agent Build Pipeline
# Auto-compiles Windows EXE agent from C# source
name: Build Vanguard Agent

on:
  push:
    paths:
      - 'VanguardAgent/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  prepare-source:
    name: Prepare Agent Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Linux)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Upload VanguardAgent source
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-agent-source
          path: VanguardAgent/
          retention-days: 1

  build-windows:
    name: Build Windows Agent
    runs-on: windows-latest
    needs: prepare-source
    
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          dotnet restore VanguardAgent/VanguardAgent.csproj
          dotnet restore VanguardInstaller/VanguardInstaller.csproj
      
      - name: Build & Publish Agent (win-x64)
        run: |
          dotnet publish VanguardAgent/VanguardAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./dist/win-x64
      
      - name: Build & Publish Agent (win-arm64)
        run: |
          dotnet publish VanguardAgent/VanguardAgent.csproj `
            -c Release `
            -r win-arm64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./dist/win-arm64
      
      - name: Build & Publish Installer EXE (win-x64)
        run: |
          dotnet publish VanguardInstaller/VanguardInstaller.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./dist/installer-x64
      
      - name: Prepare release packages
        run: |
          # Create release directory
          New-Item -ItemType Directory -Path ./release -Force
          
          # Copy agent executables
          Copy-Item ./dist/win-x64/VanguardAgent.exe ./release/VanguardAgent-win-x64.exe
          Copy-Item ./dist/win-arm64/VanguardAgent.exe ./release/VanguardAgent-win-arm64.exe
          
          # Copy installer stub EXE (this gets downloaded and configured dynamically)
          Copy-Item ./dist/installer-x64/VanguardInstaller.exe ./release/VanguardInstaller.exe
          
          # Create ZIP with installer scripts
          Copy-Item VanguardAgent/config.json ./dist/win-x64/
          Copy-Item VanguardAgent/README.md ./dist/win-x64/
          Copy-Item VanguardAgent/installer/install.bat ./dist/win-x64/install.bat
          Copy-Item VanguardAgent/installer/uninstall.bat ./dist/win-x64/uninstall.bat
          Copy-Item VanguardAgent/installer/installer.bat ./dist/win-x64/installer.bat
          
          Compress-Archive -Path ./dist/win-x64/* -DestinationPath ./release/VanguardAgent-win-x64.zip -Force
      
      - name: Generate checksums
        run: |
          $files = Get-ChildItem ./release -File
          $checksums = @()
          foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            $checksums += "$($hash.Hash)  $($file.Name)"
          }
          $checksums | Out-File ./release/checksums-sha256.txt -Encoding UTF8
          
          Write-Host "=== Checksums ==="
          Get-Content ./release/checksums-sha256.txt
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanguard-agent-windows
          path: ./release/*
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    
    permissions:
      contents: write
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vanguard-agent-windows
          path: ./artifacts
      
      - name: List artifacts
        run: ls -la ./artifacts
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Vanguard Agent v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/VanguardAgent-win-x64.exe
            ./artifacts/VanguardAgent-win-arm64.exe
            ./artifacts/VanguardAgent-win-x64.zip
            ./artifacts/checksums-sha256.txt
          body: |
            ## Ultrium Vanguard Agent v${{ github.event.inputs.version }}
            
            Enterprise RMM agent for Windows systems.
            
            ### Downloads
            | Platform | File | Description |
            |----------|------|-------------|
            | Windows x64 | `VanguardAgent-win-x64.exe` | Single-file executable |
            | Windows ARM64 | `VanguardAgent-win-arm64.exe` | ARM64 executable |
            | Windows x64 | `VanguardAgent-win-x64.zip` | Complete package with installer |
            
            ### Installation (Recommended: Portal Download)
            
            **For production use**, download pre-configured agents from the [Vanguard Dashboard](https://ultriumai.com/vanguard/app/customers) 
            which automatically includes your credentials.
            
            ### Manual Installation (Advanced)
            
            1. Download `VanguardAgent-win-x64.zip` and extract
            2. Edit `config.json` with your credentials from the [Ultrium Dashboard](https://ultriumai.com/vanguard/app/settings)
            3. Run `install.bat` as Administrator
            4. The service will start automatically
            
            ### Verify Checksums
            ```powershell
            Get-FileHash VanguardAgent-win-x64.exe -Algorithm SHA256
            ```
            Compare with `checksums-sha256.txt`
            
            ### Service Management
            ```powershell
            # Check status
            Get-Service VanguardAgent
            
            # Restart
            Restart-Service VanguardAgent
            
            # View logs
            Get-EventLog -LogName Application -Source VanguardAgent -Newest 20
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-storage:
    name: Upload to Supabase Storage
    needs: [build-windows, release]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    
    steps:
      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is not set. Please add it in GitHub Settings > Secrets > Actions."
            echo "Value should be: https://nsyobmjpdpvesjwdphlh.supabase.co"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set. Please add it in GitHub Settings > Secrets > Actions."
            echo "Get this from your Supabase Dashboard > Project Settings > API > service_role key"
            exit 1
          fi
          echo "✓ All required secrets are configured"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: vanguard-agent-windows
          path: ./artifacts
      
      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Uploading VanguardAgent-win-x64.exe to Supabase Storage..."
          
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/vanguard-agents/VanguardAgent-win-x64.exe" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @./artifacts/VanguardAgent-win-x64.exe)
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Successfully uploaded VanguardAgent-win-x64.exe (HTTP $HTTP_STATUS)"
          else
            echo "::error::Upload failed with HTTP $HTTP_STATUS"
            cat /tmp/response.txt
            exit 1
          fi
          
          echo "Uploading VanguardInstaller.exe to Supabase Storage..."
          
          HTTP_STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/vanguard-agents/VanguardInstaller.exe" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            --data-binary @./artifacts/VanguardInstaller.exe)
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Successfully uploaded VanguardInstaller.exe (HTTP $HTTP_STATUS)"
          else
            echo "::error::Upload failed with HTTP $HTTP_STATUS"
            cat /tmp/response.txt
            exit 1
          fi
