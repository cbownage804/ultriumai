name: Build Wrayth Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build WraythAgent.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r build-requirements.txt

      - name: Build with PyInstaller
        working-directory: agent
        run: pyinstaller --clean --noconfirm wrayth_agent.spec

      - name: Smoke test the EXE
        working-directory: agent
        run: |
          dir dist
          # Just verify it starts and exits cleanly with no config
          $out = & .\dist\WraythAgent.exe 2>&1 | Select-Object -First 5
          Write-Host "Agent stdout: $out"
          # Missing enrollment is expected exit 1 — success for the smoke test
          if ($LASTEXITCODE -ne 1 -and $LASTEXITCODE -ne 0) {
            Write-Error "Unexpected exit: $LASTEXITCODE"; exit 1
          }
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WraythAgent-windows
          path: agent/dist/WraythAgent.exe
          if-no-files-found: error

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/WraythAgent.exe
          fail_on_unmatched_files: true
