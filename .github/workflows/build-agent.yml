name: Build Wrayth Agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build WraythAgent.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r build-requirements.txt

      - name: Build with PyInstaller
        working-directory: agent
        run: pyinstaller --clean --noconfirm wrayth_agent.spec

      - name: Smoke test the EXE
        working-directory: agent
        shell: pwsh
        run: |
          if (-not (Test-Path dist\WraythAgent.exe)) {
            throw "WraythAgent.exe was not produced by PyInstaller"
          }
          $size = (Get-Item dist\WraythAgent.exe).Length
          Write-Host "Built WraythAgent.exe ($([math]::Round($size/1MB,2)) MB)"
          # Launch and force-kill after 3s; the agent is a long-running loop
          # so we only care that the binary starts without a load error.
          $p = Start-Process -FilePath .\dist\WraythAgent.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if (-not $p.HasExited) { $p.Kill() }
          Write-Host "Agent started cleanly."

      - name: Download WinSW (service wrapper)
        working-directory: agent
        shell: pwsh
        run: |
          # WinSW wraps our long-running python EXE so Windows SCM sees a
          # proper service and doesn't time out with Error 1053.
          $url = "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Invoke-WebRequest -Uri $url -OutFile dist\WraythService.exe
          $size = (Get-Item dist\WraythService.exe).Length
          Write-Host "Fetched WinSW ($([math]::Round($size/1KB,1)) KB)"

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup not available on runner"
          }
          Write-Host "ISCC: $iscc"

      - name: Derive installer version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^agent-v(.+)$') { $v = $Matches[1] } else { $v = "0.0.$($env:GITHUB_RUN_NUMBER)" }
          Write-Host "Version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile WraythSetup.exe (Inno Setup)
        working-directory: agent/installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} wrayth.iss
          dir ..\dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WraythAgent-windows
          path: |
            agent/dist/WraythAgent.exe
            agent/dist/WraythSetup.exe
          if-no-files-found: error

      - name: Attach to existing Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/dist/WraythAgent.exe
            agent/dist/WraythSetup.exe
          fail_on_unmatched_files: true

      # Publish/refresh a rolling "latest" release on every main build so that
      # https://github.com/<owner>/<repo>/releases/latest/download/WraythSetup.exe
      # always resolves (the in-app installer dialog links there).
      - name: Publish rolling "latest" Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wrayth Agent (latest)
          body: |
            Auto-built from commit ${{ github.sha }} on ${{ github.ref_name }}.
            Download **WraythSetup.exe** and paste your enrollment code.
          prerelease: false
          make_latest: "true"
          files: |
            agent/dist/WraythAgent.exe
            agent/dist/WraythSetup.exe
          fail_on_unmatched_files: true
