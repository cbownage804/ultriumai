name: Build Vanguard Portal

on:
  push:
    paths:
      - 'VanguardPortal/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore VanguardPortal/VanguardPortal.csproj

      - name: Build and Publish
        run: |
          dotnet publish VanguardPortal/VanguardPortal.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ github.event.inputs.version || '1.0.0' }} `
            -o ./publish/${{ matrix.runtime }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanguardPortal-${{ matrix.runtime }}
          path: ./publish/${{ matrix.runtime }}/VanguardPortal.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.create_release == 'true'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            sha256sum VanguardPortal.exe > VanguardPortal.exe.sha256
            cd ..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: portal-v${{ github.event.inputs.version }}
          name: Vanguard Portal v${{ github.event.inputs.version }}
          body: |
            ## Vanguard Customer Portal v${{ github.event.inputs.version }}
            
            Windows system tray application for customer portal access.
            
            ### Downloads
            - `VanguardPortal-win-x64.exe` - For 64-bit Windows
            - `VanguardPortal-win-arm64.exe` - For ARM64 Windows
            
            ### Installation
            1. Download the appropriate EXE for your system
            2. Place in desired folder with your config.json
            3. Run VanguardPortal.exe
            
            The application will appear in your system tray.
          files: |
            artifacts/VanguardPortal-win-x64/VanguardPortal.exe
            artifacts/VanguardPortal-win-x64/VanguardPortal.exe.sha256
            artifacts/VanguardPortal-win-arm64/VanguardPortal.exe
            artifacts/VanguardPortal-win-arm64/VanguardPortal.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
