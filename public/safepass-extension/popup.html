<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePass</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Login View -->
    <div id="login-view" class="view">
      <div class="header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>SafePass</span>
        </div>
      </div>
      <div class="content">
        <p class="login-description">Enter your SafeSuite credentials to unlock your password vault.</p>
        <input type="email" id="email" placeholder="Email address" autocomplete="email" />
        <input type="password" id="master-password" placeholder="Master password" autocomplete="current-password" />
        <button id="login-btn" class="primary-btn">Unlock Vault</button>
        <a href="#" id="open-portal" class="link">Open SafePass Portal →</a>
        <p class="browser-note">Works on Chrome & Edge</p>
      </div>
    </div>

    <!-- Vault View -->
    <div id="vault-view" class="view hidden">
      <div class="header">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>SafePass</span>
        </div>
        <div class="header-actions">
          <button id="sync-btn" class="icon-btn" title="Sync vault">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
              <path d="M16 16h5v5"/>
            </svg>
          </button>
          <button id="lock-btn" class="icon-btn" title="Lock vault">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </button>
        </div>
      </div>
      
      <div class="search-bar">
        <input type="text" id="search" placeholder="Search passwords..." />
      </div>

      <div class="content">
        <div id="current-site" class="site-section hidden">
          <h3>📍 For this site</h3>
          <div id="current-site-passwords"></div>
        </div>
        
        <div class="all-section">
          <h3>🔐 All Passwords</h3>
          <div id="all-passwords"></div>
        </div>
      </div>

      <div class="footer">
        <button id="generate-btn" class="secondary-btn">⚡ Generate</button>
        <button id="add-btn" class="secondary-btn">➕ Add New</button>
      </div>
    </div>

    <!-- Password Generator -->
    <div id="generator-view" class="view hidden">
      <div class="header">
        <button id="back-btn" class="icon-btn">←</button>
        <span>Password Generator</span>
      </div>
      <div class="content">
        <div class="generated-password">
          <input type="text" id="generated-pw" readonly />
          <button id="copy-btn" class="icon-btn" title="Copy">📋</button>
        </div>
        <div class="options">
          <label>
            <span>Length: <span id="length-value">16</span></span>
            <input type="range" id="pw-length" min="8" max="64" value="16" />
          </label>
          <label>
            <input type="checkbox" id="pw-uppercase" checked />
            <span>Uppercase (A-Z)</span>
          </label>
          <label>
            <input type="checkbox" id="pw-lowercase" checked />
            <span>Lowercase (a-z)</span>
          </label>
          <label>
            <input type="checkbox" id="pw-numbers" checked />
            <span>Numbers (0-9)</span>
          </label>
          <label>
            <input type="checkbox" id="pw-symbols" checked />
            <span>Symbols (!@#$)</span>
          </label>
        </div>
        <button id="regenerate-btn" class="primary-btn">🔄 Regenerate</button>
        <button id="use-password-btn" class="secondary-btn" style="margin-top:8px">Use Password</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
