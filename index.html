    <script>
      // AGGRESSIVE CACHE BUSTER - runs IMMEDIATELY before anything else.
      // Clears any stale Vite deps cache that can cause duplicate React instances.
      (function() {
        var FORCE_CLEAN_KEY = 'ultrium_force_clean_v5';
        var hostname = window.location.hostname;
        var isPreview = hostname.includes('lovableproject.com') || hostname.startsWith('id-preview--');
        
        // On preview origins, always do a one-time aggressive cleanup per session.
        if (isPreview && !sessionStorage.getItem(FORCE_CLEAN_KEY)) {
          sessionStorage.setItem(FORCE_CLEAN_KEY, '1');
          
          // Clear all caches
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
          
          // Unregister all service workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          
          // Force hard reload after cleanup
          setTimeout(function() { window.location.reload(); }, 50);
          return; // Stop execution to allow reload
        }
        
        // Error handler for dispatcher/hook errors - clears state and reloads
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.includes('dispatcher') || e.message.includes('Invalid hook'))) {
            // Guard: only reload once per session to prevent infinite loops
            var HOOK_RELOAD_KEY = '__hook_error_reload__';
            if (sessionStorage.getItem(HOOK_RELOAD_KEY)) return;
            sessionStorage.setItem(HOOK_RELOAD_KEY, '1');
            
            // Remove specific crash keys — do NOT clear all of sessionStorage
            localStorage.removeItem('ultrium_last_crash');
            
            // Clear caches
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(n) { caches.delete(n); });
              });
            }
            
            // Unregister service workers
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            
            // Reload after cleanup
            setTimeout(function() { window.location.reload(); }, 100);
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA support - ONLY on production domains.
      const hostname = window.location.hostname;
      const isLovablePreviewOrigin =
        hostname.includes('lovableproject.com') || hostname.startsWith('id-preview--');

      // Skip SW registration entirely on preview origins - handled in cleanup script above.
      if (!isLovablePreviewOrigin && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);

              // Check for updates immediately and periodically
              registration.update();
              setInterval(() => registration.update(), 60000);

              // Handle updates - force refresh when new SW is available
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });

        // Let new SW activate silently — no auto-reload to preserve React state
      }
    </script>
