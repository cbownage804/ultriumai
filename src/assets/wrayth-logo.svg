       C 60 4, 26 46, 26 110
       L 26 214
       C 26 224, 34 232, 44 232
       L 78 232
       L 100 168
       L 122 232
       L 156 232
       C 166 232, 174 224, 174 214
       L 174 110
       C 174 46, 140 4, 100 4 Z
       M 100 96
       L 66 200
       L 100 200
       L 134 200 Z"
  />
